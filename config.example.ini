# /etc/tripline/config.ini

[kismet]
url = http://127.0.0.1:2501
user = kismet
password = CHANGE_ME

# Alerts are always logged and shown in the web UI. Push delivery is optional and
# off until you fill in one of the sections below.

[ntfy]
# Leave topic blank to disable. Otherwise use a long random name (anyone who knows
# it can read your alerts), or point url at your own ntfy server.
url = https://ntfy.sh
topic =

[webhook]
# Optional. Each alert is POSTed as JSON: {"title","message","priority","ts"}.
url =

[detect]
poll_seconds = 5

# RSSI floors in dBm. More negative = detects farther out.
# Start permissive, then tighten using the learning-period data.
wifi_rssi = -80
bt_rssi = -85

# A static-address unknown device must stay above the RSSI floor this long
# (gaps up to gap_seconds are tolerated) before alerting.
dwell_seconds = 20
gap_seconds = 15

# Minimum time between repeat alerts for the same device or the same burst alert.
alert_cooldown_minutes = 30

# Rotating-address handling: count distinct strong random addresses seen in the
# last random_window_seconds. Alert when the count exceeds
#   (learned household peak + margin_home)   in home mode
#   (margin_away)                            in away mode
random_window_seconds = 60
random_margin_home = 2
random_margin_away = 0
burst_confirm_seconds = 30

# Your own access-point BSSIDs, comma-separated (for example aa:bb:cc:dd:ee:ff).
# A Wi-Fi client associated with one is part of your network: it is marked known
# immediately and never counted as a rotating address. Find the BSSIDs on your
# router or AP admin page, or with `iw dev wlan0 link` from a connected device.
home_bssids =

# Your own network names (comma-separated). A device that probes for one of these is treated
# as yours: marked known and never counted as a rotating address. Also editable in the web UI.
# Anyone who ever joined your Wi-Fi, a past guest for instance, probes for it too; set
# ssid_marks_known = false to use the names for linking suggestions only.
home_ssids =
ssid_marks_known = true

# Store at most one sighting per device per this many seconds (keeps the database small).
sighting_interval_seconds = 10

retention_days = 30
db_path = /var/lib/tripline/tripline.db

[web]
# Localhost only by default. To reach the UI from your LAN, set bind to the Pi's
# address and set a password; web.py refuses to start on a non-loopback address
# without one.
bind = 127.0.0.1
port = 8080
user = admin
password =

[vehicles]
# Vehicle detection from tyre-pressure sensors with an RTL-SDR dongle and rtl_433
# (run by tpms.py / the tripline-tpms service). The installer turns this on when it finds a dongle.
enabled = false
# A sensor's band is unknown in advance (US cars are mostly 315M, many imports and some
# domestic models use 433.92M), so the default watches both. One dongle can only listen to
# one band at a time: it hops between them every hop_seconds, so each band is covered about
# half the time. A second dongle, one per band, gives full coverage (set a single frequency
# and a different `device` on a second tpms.py instance).
frequencies = 315M, 433.92M
hop_seconds = 10
# Which dongle, if you have several (index or serial).
device = 0
# Advanced: full decoder command. {device} and {freqs} are filled in. Must print rtl_433 JSON.
command =

[sync]
# Known-device sources to run with known_sync.py (comma-separated; each needs a
# [source.<name>] section). Leave blank to manage known devices by hand in the UI.
sources =
interval_minutes = 15

[source.file]
# One device per line: "aa:bb:cc:dd:ee:ff Label". See examples/known_devices.txt.
path = /etc/tripline/known_devices.txt

[source.unifi]
# UniFi Network (Cloud Key, UniFi OS console or self-hosted controller).
url = https://192.168.1.2
site = default
# Use an API key (Network 10.1+) or a local, non-SSO, no-MFA account with a read-only role.
api_key =
username =
password =
verify_tls = false
# all = every client the controller knows, named = only clients you gave a name
include = all
# UniFi remembers every client it has ever seen. Skip clients the controller has not
# seen for this many days (they stop being known, and Tripline removes them once they
# have also been unheard for retention_days). 0 keeps everything UniFi lists.
max_age_days = 30
