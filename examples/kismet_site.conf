# /etc/kismet/kismet_site.conf
# Verify option names against your installed Kismet version (kismet --version).

# Web UI and REST API on localhost only
httpd_bind_address=127.0.0.1

# Wi-Fi: USB monitor-mode adapter (check the interface name with `iw dev`)
source=wlan1:name=wifi,hop=true,hop_rate=5/sec

# Bluetooth: Pi built-in radio, BLE advertisement scanning
source=hci0:name=bt,type=linuxbluetooth

# Keep the Kismet log small: device records only, no packet capture
log_types=kismet
kis_log_packets=false
log_prefix=/var/log/kismet/
